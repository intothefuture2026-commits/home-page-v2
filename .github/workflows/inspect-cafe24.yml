name: Inspect Cafe24 folders

on:
  workflow_dispatch:

permissions: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Inspect FTP current directory without changing files
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.CAFE24_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.CAFE24_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.CAFE24_FTP_PASSWORD }}
        run: |
          curl --verbose --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/"